user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {

    # Gzip
    gzip on;
    gzip_types application/json application/javascript text/css text/plain application/xml;
    gzip_min_length 1024;

    # Buffers
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Timeouts
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Cache
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=supermarket_cache:50m
                     inactive=30m use_temp_path=off;

    upstream supermarket_app {
        ip_hash;
        server 10.0.136.157:8080 max_fails=3 fail_timeout=10s;
        server 10.0.138.135:8080 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name _;

        # Headers de segurança (OWASP)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Healthcheck do Load Balancer
        location /healthcheck {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        location / {

            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://supermarket_app;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;

            # Header para identificar qual EC2 respondeu
            proxy_set_header X-Upstream-Server $upstream_addr;

            proxy_cache supermarket_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_valid 200 10m;
            proxy_cache_valid 404 1m;
        }
    }
}
