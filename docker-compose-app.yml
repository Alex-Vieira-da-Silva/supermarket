services:
  supermarket:
    image: ${ECR_IMAGE:-123456789012.dkr.ecr.us-east-1.amazonaws.com/supermarket-app:v2.3}
    container_name: supermarket-v2.3
    pull_policy: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}

    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: supermarket-app
        awslogs-stream: app-${HOSTNAME}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: always
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
