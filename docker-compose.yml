services:
  app:
    image: 992500432181.dkr.ecr.us-east-1.amazonaws.com/supermarket-app:latest
    container_name: supermarket-app
    ports:
      - "8080:8080"
    restart: always

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
