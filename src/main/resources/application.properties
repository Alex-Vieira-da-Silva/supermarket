spring.application.name=supermarket

server.port=8080

spring.datasource.url=${DB_URL:jdbc:h2:mem:supermarket;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

management.endpoints.web.exposure.include=health,info

springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# JWT
jwt.secret=${JWT_SECRET:change-me-please-0123456789abcdef0123456789abcdef}
jwt.expiration=${JWT_EXPIRATION:3600000}
